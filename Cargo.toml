[workspace]
members = [
    "crates/deepgemm-sys",
    "crates/deepgemm",
    "crates/candle-deepgemm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
candle = { git = "https://www.github.com/mixlayer/candle.git", package = "candle-core", rev = "c200a03ae3b7bb3b4a2ce6ff689818ed5eb8c71b", features = ["cuda"] }
deepgemm-sys = { path = "crates/deepgemm-sys" }
deepgemm = { path = "crates/deepgemm" }
float8 = "0.7.0"
half = "2.4.1"
